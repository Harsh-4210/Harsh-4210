<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">TraceLink manufacturing traceability graph</title>
  <desc id="desc">A graph connecting raw materials to production, quality control, dispatch, and customers with forward and reverse investigation.</desc>
  <rect width="900" height="220" rx="12" fill="#f8fafc" stroke="#dbe4ee"/>
  <text x="34" y="38" fill="#334155" font-family="Segoe UI,sans-serif" font-size="15" letter-spacing="2">TRACELINK · TRACE FORWARD OR BACKWARD</text>
  <g fill="none" stroke="#64748b" stroke-width="2" opacity=".9"><path d="M130 116H285M315 116H470M500 116H655M685 116H820"/><path d="M820 96C620 30 350 30 130 96" stroke="#d97706" stroke-dasharray="6 7"/></g>
  <g font-family="Segoe UI,sans-serif" text-anchor="middle"><g fill="#ffffff" stroke="#2563eb" stroke-width="2"><circle cx="100" cy="116" r="30"/><circle cx="285" cy="116" r="30"/><circle cx="470" cy="116" r="30"/><circle cx="655" cy="116" r="30"/><circle cx="820" cy="116" r="30"/></g><g fill="#1e293b" font-size="13"><text x="100" y="112">Raw lots</text><text x="100" y="130">input</text><text x="285" y="112">Batches</text><text x="285" y="130">production</text><text x="470" y="112">QC</text><text x="470" y="130">inspection</text><text x="655" y="112">Dispatch</text><text x="655" y="130">orders</text><text x="820" y="112">Customers</text><text x="820" y="130">impact</text><text x="475" y="70" fill="#b45309" font-size="13">blast-radius investigation</text></g></g>
  <circle cx="100" cy="116" r="6" fill="#2563eb"><animate attributeName="cx" values="100;820;100" dur="6s" repeatCount="indefinite"/></circle>
</svg>
