<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Harsh Jain, Applied ML and AI Engineer</title>
  <desc id="desc">An animated blue technical banner with the name Harsh Jain and the phrase learn, reason, ship.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b2638"/>
      <stop offset="1" stop-color="#063f52"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#54d6c7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#54d6c7"/>
      <stop offset="1" stop-color="#54d6c7" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <path d="M0 222 C220 170 320 260 520 205 S880 155 1200 215" fill="none" stroke="#54d6c7" stroke-opacity=".14" stroke-width="2"/>
  <path d="M0 242 C220 190 320 280 520 225 S880 175 1200 235" fill="none" stroke="#54d6c7" stroke-opacity=".08" stroke-width="2"/>
  <rect x="86" y="68" width="510" height="3" rx="2" fill="url(#glow)" filter="url(#softGlow)" opacity=".8">
    <animate attributeName="x" values="-420;1100;-420" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g fill="none" stroke="#54d6c7" stroke-width="2" opacity=".55">
    <circle cx="1000" cy="82" r="38"><animate attributeName="r" values="30;48;30" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="82" r="58" opacity=".35"><animate attributeName="r" values="48;72;48" dur="4s" repeatCount="indefinite"/></circle>
    <path d="M923 82h154M1000 5v154" opacity=".3"/>
  </g>
  <g fill="#54d6c7">
    <circle cx="923" cy="82" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="1077" cy="82" r="4"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
  </g>
  <text x="86" y="145" fill="#ffffff" font-family="Space Grotesk,Segoe UI,sans-serif" font-size="62" font-weight="700">Harsh Jain</text>
  <text x="90" y="184" fill="#9ddbd5" font-family="Space Grotesk,Segoe UI,sans-serif" font-size="21" letter-spacing="2">LEARN  ·  REASON  ·  SHIP</text>
  <text x="90" y="226" fill="#b5c8d3" font-family="Segoe UI,sans-serif" font-size="17">Applied ML &amp; AI Engineer · Reinforcement Learning · LLM Systems</text>
</svg>
